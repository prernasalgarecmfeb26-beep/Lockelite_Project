server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: lockelite-backend

  datasource:
    url: jdbc:mysql://localhost:3306/lockelite_db1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: cdac
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  sql:
    init:
      mode: always                          # always run schema.sql on startup
      schema-locations: classpath:schema.sql
      data-locations:                       # no data.sql — DataInitializer handles seeding

  jpa:
    hibernate:
      ddl-auto: update                      # update keeps existing data, adds missing columns
    defer-datasource-initialization: true   # ensure sql.init runs BEFORE Hibernate validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: "prathampathari567@gmail.com"
    password: "oywghunrgddwdrbk"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  async:
    executor:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 100

